user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip on;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name satopon.satokenai.com;
        return 301 https://$host$request_uri;
    }

    # HTTPS (SSL終端)
    server {
        listen 443 ssl http2;
        server_name satopon.satokenai.com;

        ssl_certificate     /etc/letsencrypt/live/satopon.satokenai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/satopon.satokenai.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Frontend (Next.js静的サイト)
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Backend (FastAPI)
        location /api/ {
            allow 172.18.0.0/16;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

