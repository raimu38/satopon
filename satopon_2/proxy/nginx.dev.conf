events {}


http {
  server {
    listen 443 ssl;
    server_name satokenai.com;

    ssl_certificate /etc/nginx/ssl/satokenai.crt;
    ssl_certificate_key /etc/nginx/ssl/satokenai.key;

    location /api/ {
      proxy_pass http://backend:8000/;
    }

    location / {
      proxy_pass http://frontend:80/;
    }
  }
}

